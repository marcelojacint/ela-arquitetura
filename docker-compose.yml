services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ela_arquitetura
      POSTGRES_USER: ela_arquitetura
      POSTGRES_PASSWORD: ela_arquitetura_dev
    ports:
      - "5433:5432"
    volumes:
      - ela_arquitetura_db_data:/var/lib/postgresql/data

volumes:
  ela_arquitetura_db_data:
